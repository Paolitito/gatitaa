<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canela Wörter</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{/* Layout: zehn Tage untereinander, je fünf Karten im Raster */
--bg:#fff8f0;--ink:#3a2a4a;--soft:#7a6a8c;--red:#f2453d;--sky:#4f9dff;--violet:#9b6bff;
--display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;--body:"Nunito","Segoe UI",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding:20px 16px 48px}
main{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
h1{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.05;margin:0;color:var(--red)}
h2{font-family:var(--display);font-weight:800;font-size:1.25rem;margin:0}
p{margin:4px 0 0;color:var(--soft);max-width:62ch}
section{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 4px 0 rgba(58,42,74,.08);display:flex;flex-direction:column}
.card svg{display:block;width:100%;height:auto}
.meta{padding:8px 12px 10px;display:flex;flex-direction:column;gap:1px}
.word{font-family:var(--display);font-weight:800;font-size:1.35rem;line-height:1}
.es{color:var(--soft);font-size:.9rem}
.badge{align-self:flex-start;font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--k);border-radius:99px;padding:1px 9px;margin-bottom:3px}
.sent{margin-top:5px;font-weight:700;font-size:.92rem;line-height:1.25}.sent b{color:var(--red);background:#ffe9d6;border-radius:5px;padding:0 3px}.ses{color:var(--soft);font-size:.82rem;line-height:1.25}
.missing{aspect-ratio:1;display:grid;place-items:center;background:#eee;color:#999}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.tail{transform-origin:18px -14px;animation:wag 1.6s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
.bob{transform-origin:0 0;animation:bob 1.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:rotate(-10deg)}to{transform:rotate(8deg)}}
.wave{transform-origin:0 0;animation:wave .5s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-20deg)}to{transform:rotate(16deg)}}
.tilt{transform-origin:0 -45px;animation:tilt 2s ease-in-out infinite alternate}
@keyframes tilt{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.jump{animation:jump .9s cubic-bezier(.3,0,.3,1) infinite alternate}
@keyframes jump{from{transform:translateY(0)}to{transform:translateY(-42px)}}
.hop{animation:hop .6s cubic-bezier(.3,0,.3,1) infinite alternate}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-14px)}}
.shadow{transform-box:fill-box;transform-origin:center;animation:shadow .9s cubic-bezier(.3,0,.3,1) infinite alternate}
@keyframes shadow{from{transform:scale(1);opacity:.25}to{transform:scale(.55);opacity:.12}}
.pulse{transform-origin:0 0;animation:pulse 1.6s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.05)}}
.beat{transform-box:fill-box;transform-origin:center;animation:beat .6s ease-in-out infinite alternate}
@keyframes beat{from{transform:scale(1)}to{transform:scale(1.1)}}
.swim{transform-box:fill-box;transform-origin:center;animation:swim 5s linear infinite}
@keyframes swim{0%{transform:translateX(-15px) scaleX(1)}45%{transform:translateX(15px) scaleX(1)}50%{transform:translateX(15px) scaleX(-1)}95%{transform:translateX(-15px) scaleX(-1)}100%{transform:translateX(-15px) scaleX(1)}}
.bubble{animation:bubble 2.4s ease-in infinite}
@keyframes bubble{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-34px);opacity:0}}
.peek{animation:peek 5s ease-in-out infinite}
@keyframes peek{0%,100%{transform:translate(-3px,3px)}50%{transform:translate(4px,-3px)}}
.breathe{transform-box:fill-box;transform-origin:center bottom;animation:breathe 2.6s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scaleY(1)}to{transform:scaleY(1.07)}}
.zz{animation:zz 3s ease-in-out infinite}
@keyframes zz{0%{transform:translate(0,8px);opacity:0}30%{opacity:1}100%{transform:translate(8px,-14px);opacity:0}}
.twinkle{animation:twinkle 1.8s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.25}to{opacity:1}}
.drop{animation:drop .8s linear infinite}
@keyframes drop{from{transform:translateY(-40px)}to{transform:translateY(170px)}}
.drip{animation:drip 1.1s ease-in infinite}
@keyframes drip{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(46px);opacity:0}}
.cloud{animation:cloud 4s ease-in-out infinite alternate}
@keyframes cloud{from{transform:translateX(-6px)}to{transform:translateX(8px)}}
.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 1.4s ease-out infinite}
@keyframes ripple{from{transform:scale(.3);opacity:.9}to{transform:scale(1.2);opacity:0}}
.sway{transform-origin:0 0;animation:sway 2.4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.dance{transform-origin:0 0;animation:dance .5s ease-in-out infinite alternate}
@keyframes dance{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.shiver{animation:shiver .14s linear infinite alternate}
@keyframes shiver{from{transform:translateX(-1.4px)}to{transform:translateX(1.4px)}}
.laugh{animation:laugh .16s linear infinite alternate}
@keyframes laugh{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.snow{animation:snow 4s linear infinite}
@keyframes snow{from{transform:translate(0,-30px)}to{transform:translate(12px,210px)}}
.puff{transform-box:fill-box;transform-origin:center;animation:puff 2.2s ease-out infinite}
@keyframes puff{0%{transform:translate(0,0) scale(.4);opacity:0}25%{opacity:.9}100%{transform:translate(14px,-12px) scale(1.3);opacity:0}}
.munch{transform-origin:0 0;animation:munch .7s ease-in-out infinite alternate}
@keyframes munch{from{transform:rotate(20deg)}to{transform:rotate(-24deg)}}
.chew{transform-box:fill-box;transform-origin:center;animation:chew .35s ease-in-out infinite alternate}
@keyframes chew{from{transform:scaleY(1)}to{transform:scaleY(.45)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}20%{opacity:1}100%{transform:translateY(-46px) scale(1.1);opacity:0}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.spinfast{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.smoke{animation:smoke 3s ease-out infinite}
@keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:.9}100%{transform:translate(10px,-34px) scale(1.4);opacity:0}}
.flower{transform-box:fill-box;transform-origin:center bottom;animation:flw 2s ease-in-out infinite alternate}
@keyframes flw{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.wiggle{transform-box:fill-box;transform-origin:center bottom;animation:flw .35s ease-in-out infinite alternate}
.conf{animation:conf 2.8s linear infinite}
@keyframes conf{from{transform:translateY(-30px) rotate(0)}to{transform:translateY(220px) rotate(320deg)}}
.road{animation:road .5s linear infinite}
@keyframes road{from{transform:translateX(0)}to{transform:translateX(-40px)}}
.scroll{animation:scroll 6s linear infinite}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-200px)}}
.footA{animation:footA .26s ease-in-out infinite alternate}
.footB{animation:footA .26s ease-in-out infinite alternate-reverse}
@keyframes footA{from{transform:translate(-7px,0)}to{transform:translate(7px,-3px)}}
.stepA{animation:footA .55s ease-in-out infinite alternate}
.stepB{animation:footA .55s ease-in-out infinite alternate-reverse}
.swingA{transform-origin:0 0;animation:swing .26s ease-in-out infinite alternate}
.swingB{transform-origin:0 0;animation:swing .26s ease-in-out infinite alternate-reverse}
.slowA{transform-origin:0 0;animation:swing .55s ease-in-out infinite alternate}
.slowB{transform-origin:0 0;animation:swing .55s ease-in-out infinite alternate-reverse}
@keyframes swing{from{transform:rotate(-34deg)}to{transform:rotate(34deg)}}
.runbob{animation:runbob .26s ease-in-out infinite alternate}
@keyframes runbob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.walkbob{animation:runbob .55s ease-in-out infinite alternate}
.dooropen{transform-box:fill-box;transform-origin:left center;animation:dooropen 3s ease-in-out infinite alternate}
@keyframes dooropen{0%,15%{transform:scaleX(1)}85%,100%{transform:scaleX(.22)}}
.lid{transform-box:fill-box;transform-origin:left bottom;animation:lid 2.6s ease-in-out infinite alternate}
@keyframes lid{0%,15%{transform:rotate(0)}85%,100%{transform:rotate(-58deg)}}
.float{animation:float 2.2s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-12px)}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring .1s linear infinite alternate}
@keyframes ring{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.flip{transform-box:fill-box;transform-origin:left center;animation:flip 2.4s ease-in-out infinite}
@keyframes flip{0%,20%{transform:scaleX(1)}60%,100%{transform:scaleX(-1)}}
.draw{stroke-dasharray:80;animation:draw 3s linear infinite}
@keyframes draw{from{stroke-dashoffset:80}to{stroke-dashoffset:0}}
.pen{animation:pen .5s ease-in-out infinite alternate}
@keyframes pen{from{transform:translate(-3px,0)}to{transform:translate(4px,-2px)}}
.throwball{animation:throwball 1.6s linear infinite}
@keyframes throwball{0%{transform:translate(0,0)}25%{transform:translate(28px,-34px)}50%{transform:translate(58px,-44px)}75%{transform:translate(88px,-30px)}100%{transform:translate(112px,8px)}}
.throwarm{transform-origin:0 0;animation:throwarm 1.6s ease-out infinite}
@keyframes throwarm{0%{transform:rotate(-50deg)}18%{transform:rotate(50deg)}60%,100%{transform:rotate(-50deg)}}
.givemove{animation:givemove 1.8s ease-in-out infinite alternate}
@keyframes givemove{0%,15%{transform:translateX(0)}85%,100%{transform:translateX(30px)}}
.pop{animation:pop 3.2s ease-in-out infinite}
@keyframes pop{0%,18%{transform:translateY(52px)}36%,78%{transform:translateY(0)}96%,100%{transform:translateY(52px)}}
.sitdown{animation:sitdown 2.6s ease-in-out infinite}
@keyframes sitdown{0%{transform:translateY(-16px)}25%,100%{transform:translateY(0)}}
.sweat{animation:sweat 1.3s ease-in infinite}
@keyframes sweat{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(20px);opacity:0}}
.heatw{animation:heatw 1.6s ease-in-out infinite alternate}
@keyframes heatw{from{transform:translateY(0);opacity:.3}to{transform:translateY(-8px);opacity:.9}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 3s ease-in-out infinite}
@keyframes grow{0%{transform:scaleX(.05)}70%,100%{transform:scaleX(1)}}
.glow{animation:glow 1.4s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.35}to{opacity:1}}
.flap{transform-box:fill-box;transform-origin:center;animation:flap .25s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.35)}}
.flutter{animation:flutter 5s ease-in-out infinite}
@keyframes flutter{0%{transform:translate(0,0)}25%{transform:translate(18px,-14px)}50%{transform:translate(34px,4px)}75%{transform:translate(14px,12px)}100%{transform:translate(0,0)}}
.shoot{animation:shoot 3s ease-in infinite}
@keyframes shoot{0%{transform:translate(0,0);opacity:0}10%{opacity:1}40%{transform:translate(-90px,50px);opacity:0}100%{transform:translate(-90px,50px);opacity:0}}
.roll{animation:rollx 2.4s ease-in-out infinite alternate}
@keyframes rollx{from{transform:translateX(0)}to{transform:translateX(34px)}}
.toe{transform-box:fill-box;transform-origin:center bottom;animation:flw .3s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

</style></head><body><main>
<header><h1>250 von 800 Wörtern</h1><p>Jeder Tag hat fünf Wörter. Tag 1 bis 10 sind die Bild-Wörter, ab Tag 11 geht es nach Häufigkeit. Grammatik-Wörter haben einen kleinen Satz, in dem das Wort markiert ist.</p></header>
<div id="days"></div>
</main><script>
const INK='#3a2a4a', RED='#f2453d', SUN='#ffc93c', MINT='#2fc7a8', SKY='#4f9dff', VIO='#9b6bff', ORA='#ff9a3c';
function arm(side,ang,o,prop,cls){
  const x=side==='L'?-20:20;
  return `<g transform="translate(${x},-42) rotate(${ang})"><g class="${cls||''}"><ellipse cx="0" cy="12" rx="7" ry="14" fill="${o.fur}" stroke="${o.out}" stroke-width="1.6"/>${prop?`<g transform="translate(0,26) rotate(${-ang})">${prop}</g>`:''}</g></g>`;
}
function cat(o){
  o=Object.assign({fur:'#2f2b3d',out:'#1b1825',belly:'#454059',line:'#ffffff',plain:false,eyes:'open',mouth:'w',armL:18,armR:-18,armsFront:false,bow:true,prop:'',propL:'',armRcls:'',armLcls:'',headCls:'',mid:'',extra:'',tail:true,feet:'',hat:''},o);
  const S=`stroke="${o.out}" stroke-width="1.6"`, L=o.line;
  const arms=arm('L',o.armL,o,o.propL,o.armLcls)+arm('R',o.armR,o,o.prop,o.armRcls);
  const eye=x=>o.plain?`<ellipse cx="${x}" cy="-74" rx="6" ry="7.5" fill="${INK}"/><circle cx="${x+2}" cy="-77.5" r="2.4" fill="#fff"/>`:`<ellipse cx="${x}" cy="-74" rx="7" ry="8.5" fill="#ffd94d"/><ellipse cx="${x}" cy="-73.5" rx="3.6" ry="6" fill="#1b1825"/><circle cx="${x+2.4}" cy="-77.5" r="2.3" fill="#fff"/><circle cx="${x-2}" cy="-70.5" r="1" fill="#fff"/>`;
  let eyes='';
  if(o.eyes==='open') eyes=`<g class="blink">${eye(-14)}${eye(14)}</g>`;
  if(o.eyes==='happy') eyes=`<path d="M-20,-72 q6,-8 12,0 M8,-72 q6,-8 12,0" fill="none" stroke="${L}" stroke-width="2.8" stroke-linecap="round"/>`;
  if(o.eyes==='closed') eyes=`<path d="M-20,-74 q6,6 12,0 M8,-74 q6,6 12,0" fill="none" stroke="${L}" stroke-width="2.8" stroke-linecap="round"/>`;
  if(o.eyes==='wide') eyes=`<circle cx="-14" cy="-75" r="8" fill="${o.plain?'#fff':'#ffd94d'}" ${o.plain?`stroke="${INK}" stroke-width="2"`:''}/><circle cx="-14" cy="-75" r="3" fill="#1b1825"/><circle cx="14" cy="-75" r="8" fill="${o.plain?'#fff':'#ffd94d'}" ${o.plain?`stroke="${INK}" stroke-width="2"`:''}/><circle cx="14" cy="-75" r="3" fill="#1b1825"/>`;
  if(o.eyes==='spark') eyes=`${eye(-14)}${eye(14)}<path d="M-18,-80 l1.5,3 3,1.5 -3,1.5 -1.5,3 -1.5,-3 -3,-1.5 3,-1.5 Z M10,-80 l1.5,3 3,1.5 -3,1.5 -1.5,3 -1.5,-3 -3,-1.5 3,-1.5 Z" fill="#fff" class="twinkle"/>`;
  let mouth=`<path d="M-6,-61 q3,4 6,0 q3,4 6,0" fill="none" stroke="${L}" stroke-width="1.8" stroke-linecap="round"/>`;
  if(o.mouth==='open') mouth=`<g class="${o.mouthCls||''}"><ellipse cx="0" cy="-58" rx="4.5" ry="5.5" fill="#5a2a4a"/><ellipse cx="0" cy="-55.5" rx="2.6" ry="2.2" fill="#ff9a6b"/></g>`;
  if(o.mouth==='big') mouth=`<path d="M-9,-62 q9,16 18,0 Z" fill="#5a2a4a"/><path d="M-5,-56 q5,5 10,0 Z" fill="#ff9a6b"/>`;
  if(o.mouth==='o') mouth=`<ellipse cx="0" cy="-58" rx="3" ry="3.6" fill="#5a2a4a"/>`;
  if(o.mouth==='wavy') mouth=`<path d="M-8,-59 q2,-3 4,0 q2,3 4,0 q2,-3 4,0 q2,3 4,0" fill="none" stroke="${L}" stroke-width="1.8" stroke-linecap="round"/>`;
  if(o.mouth==='tongue') mouth=`<path d="M-6,-61 q3,4 6,0 q3,4 6,0" fill="none" stroke="${L}" stroke-width="1.8" stroke-linecap="round"/><path d="M-2.6,-59 h5.2 v4 a2.6,2.6 0 0 1 -5.2,0 Z" fill="#ff9a6b"/>`;
  const bow=o.bow?`<g transform="translate(-24,-104) rotate(-18)"><path d="M0,0 L-11,-7 V7 Z M0,0 L11,-7 V7 Z" fill="${RED}"/><circle r="3.4" fill="#ff8a7a"/></g>`:'';
  const fa=o.feet==='run'?['footA','footB']:o.feet==='walk'?['stepA','stepB']:['',''];
  return `
  ${o.tail?`<path class="tail" d="M18,-14 C50,-10 54,-44 40,-54" fill="none" stroke="${o.out}" stroke-width="11.5" stroke-linecap="round"/><path class="tail" d="M18,-14 C50,-10 54,-44 40,-54" fill="none" stroke="${o.fur}" stroke-width="8.5" stroke-linecap="round"/>`:''}
  <g class="${fa[0]}"><ellipse cx="-12" cy="-3" rx="10" ry="5.5" fill="${o.fur}" ${S}/></g><g class="${fa[1]}"><ellipse cx="12" cy="-3" rx="10" ry="5.5" fill="${o.fur}" ${S}/></g>
  <ellipse cx="0" cy="-28" rx="24" ry="27" fill="${o.fur}" ${S}/>
  <ellipse cx="0" cy="-24" rx="14" ry="17" fill="${o.belly}"/>
  ${o.armsFront?'':arms}
  ${o.mid}
  <g class="${o.headCls}">
    <polygon points="-32,-86 -27,-117 -6,-100" fill="${o.fur}" ${S} stroke-linejoin="round"/><polygon points="-27,-92 -25,-108 -13,-99" fill="#ffc2a3"/>
    <polygon points="32,-86 27,-117 6,-100" fill="${o.fur}" ${S} stroke-linejoin="round"/><polygon points="27,-92 25,-108 13,-99" fill="#ffc2a3"/>
    <ellipse cx="0" cy="-74" rx="36" ry="31" fill="${o.fur}" ${S}/>
    ${eyes}
    <ellipse cx="-25" cy="-62" rx="6.5" ry="4" fill="#ff7a59" opacity=".7"/><ellipse cx="25" cy="-62" rx="6.5" ry="4" fill="#ff7a59" opacity=".7"/>
    <path d="M-3.2,-67 h6.4 l-3.2,3.6 z" fill="#ff8a7a"/>
    ${mouth}
    <path d="M-31,-67 l-15,-3 M-31,-62 l-15,2 M31,-67 l15,-3 M31,-62 l15,2" stroke="${L}" stroke-opacity="${o.plain?.4:.75}" stroke-width="1.4" stroke-linecap="round"/>
    ${bow}${o.hat}
  </g>
  ${o.armsFront?arms:''}
  ${o.extra}`;
}
const FUR={orange:{fur:'#ffb347',out:'#e08a2e',belly:'#fff3dc'},grey:{fur:'#b9bdd4',out:'#8a8fb0',belly:'#eef0fa'},white:{fur:'#ffffff',out:'#cbc2e6',belly:'#fff8ef'},cream:{fur:'#ffe2b8',out:'#e0b98a',belly:'#fff6e6'}};
const K=(n,o)=>cat(Object.assign({line:INK,plain:true,bow:false},FUR[n],o||{}));
const at=(x,y,s,inner,cls)=>`<g transform="translate(${x},${y}) scale(${s})"><g class="${cls||''}">${inner}</g></g>`;
const flipAt=(x,y,s,inner,cls)=>`<g transform="translate(${x},${y}) scale(${-s},${s})"><g class="${cls||''}">${inner}</g></g>`;
const bg=c=>`<rect width="200" height="200" fill="${c}"/>`;
const floor=(y,c)=>`<rect y="${y}" width="200" height="${200-y}" fill="${c}"/>`;
const sh=(x,y,rx,cls)=>`<ellipse class="${cls||''}" cx="${x}" cy="${y}" rx="${rx}" ry="${rx/6}" fill="${INK}" opacity=".14"/>`;
const spark=(x,y,r,c,d)=>`<path class="twinkle" style="animation-delay:${d||0}s" d="M${x},${y-r} l${r*.28},${r*.72} ${r*.72},${r*.28} ${-r*.72},${r*.28} ${-r*.28},${r*.72} ${-r*.28},${-r*.72} ${-r*.72},${-r*.28} ${r*.72},${-r*.28} Z" fill="${c}"/>`;
const star5=(x,y,R,c,extra)=>{let p=[];for(let i=0;i<10;i++){const r=i%2?R*.45:R,a=-Math.PI/2+i*Math.PI/5;p.push((x+r*Math.cos(a)).toFixed(1)+','+(y+r*Math.sin(a)).toFixed(1));}return `<polygon points="${p.join(' ')}" fill="${c}" stroke-linejoin="round" ${extra||''}/>`;};
const heartP=`M0,6 C-12,-6 -6,-15 0,-7.5 C6,-15 12,-6 0,6 Z`;
const heart=(x,y,s,c,d)=>`<g transform="translate(${x},${y}) scale(${s})"><path class="rise" style="animation-delay:${d||0}s" d="${heartP}" fill="${c}"/></g>`;
const heartS=(x,y,s,c,cls)=>`<g transform="translate(${x},${y}) scale(${s})"><path class="${cls||''}" d="${heartP}" fill="${c}"/></g>`;
const note=(x,y,c,d)=>`<g transform="translate(${x},${y})"><g class="rise" style="animation-delay:${d||0}s"><ellipse cx="0" cy="0" rx="4.5" ry="3.4" fill="${c}" transform="rotate(-20)"/><path d="M4,-1 v-15 l7,2 v4 l-7,-2" fill="${c}" stroke="${c}" stroke-width="1.5" stroke-linejoin="round"/></g></g>`;
